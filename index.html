<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geostar&display=swap" rel="stylesheet" />
    <link
      rel="icon"
      type="image/png"
      href="/src/assets/img/ChatGPT%20Image%2013%20ene%202026,%2023_21_15%20%281%29.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wisp</title>
    <style>
      body.splash-activo {
        overflow: hidden;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: linear-gradient(180deg, rgba(4, 7, 13, 0.35), rgba(4, 7, 13, 0.75)),
          url('/src/assets/img/robotwisp.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: #dbe7ff;
        font-family: 'Geostar', sans-serif;
        text-align: center;
        z-index: 9999;
        transition: opacity 3s ease;
      }
      .splash--oculto {
        opacity: 0;
        pointer-events: none;
      }
      .splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 2rem;
        max-width: 32rem;
      }
      .splash__mensaje {
        margin: 0;
        font-size: clamp(1rem, 2.4vw, 1.2rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(219, 231, 255, 0.8);
        text-shadow: 0 0 1.6rem rgba(189, 210, 238, 0.685);
      }
      .splash__marca {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #b9d0ee;
        text-shadow: 0 0 2.4rem rgba(185, 208, 238, 0.6);
      }
    </style>
  </head>
  <body class="splash-activo">
    <div id="splash" class="splash" role="status" aria-live="polite">
      <div class="splash__inner">
        <p class="splash__mensaje">La siguiente evolucion de la tecnologia es</p>
        <p class="splash__marca">WISP</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
